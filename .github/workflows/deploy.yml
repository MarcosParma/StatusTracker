name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marcosparma/statustracker

jobs:
  build:
    # Se compila en las máquinas de GitHub, no en el servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Se despliega en marcosserver con el runner instalado allí
    needs: build
    runs-on: [self-hosted, marcosserver]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Actualizar contenedor
        working-directory: /home/user/apps/statustracker
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f
      - name: Comprobar que arrancó
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/StatusTracker/GetStatusServices || true)
            [ "$code" = 401 ] || [ "$code" = 200 ] && { echo "OK ($code)"; exit 0; }
            sleep 3
          done
          docker logs --tail 50 statustracker
          exit 1
